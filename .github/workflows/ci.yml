# Augmentinel CI, shaped after blast_radius (and Lineage before it).
#
# Every PR builds on Windows and macOS, runs a smoke test, and uploads the game
# as a downloadable artifact (Augmentinel-windows-x64, Augmentinel-macos). Tag
# pushes (v*) do the same, sign the Windows exe when the eSigner secrets exist,
# and publish it to itch.io. macOS signing and notarisation run locally
# (packaging/macos/build_dmg.sh). See docs/releasing.md.

name: CI

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "OS legs to build/test"
        type: choice
        default: all
        options: [all, macos, windows]
      sign:
        description: "Sign the Windows exe with eSigner (uses signing quota; needs the ES_* secrets)"
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emit the build matrix from the dispatch input.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      sign: ${{ steps.m.outputs.sign }}
    steps:
      - id: m
        shell: bash
        run: |
          sel="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then sel="${{ inputs.platforms }}"; fi
          case "$sel" in
            macos)   m='["macos-14"]' ;;
            windows) m='["windows-latest"]' ;;
            *)       m='["macos-14","windows-latest"]' ;;
          esac
          echo "matrix={\"os\":$m}" >> "$GITHUB_OUTPUT"
          # Windows signing runs on release tags, or on dispatch when asked. PRs
          # never sign, so they cannot spend the eSigner quota.
          sign=false
          if [ "${{ github.event_name }}" = "push" ]; then sign=true; fi
          if [ "${{ inputs.sign }}" = "true" ]; then sign=true; fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      # "true" only when this run should sign (tag or dispatch) AND the eSigner
      # secrets exist. ES_USERNAME is the gate: while it is empty every signing
      # step skips and the build ships unsigned.
      WIN_SIGN: ${{ needs.setup.outputs.sign == 'true' && secrets.ES_USERNAME != '' }}
      # The runners have no sound card.
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # macOS builds the shipping shape directly: a universal2 app bundle.
      - name: Configure (macOS, universal2 app bundle)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAUGMENTINEL_MACOS_BUNDLE=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j

      # The runners have no OpenGL 3.3 driver, so the smoke test runs on Mesa's
      # software renderer, from a scratch copy so its DLLs never ship.
      - name: Smoke test (Windows, Mesa llvmpipe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GALLIUM_DRIVER: llvmpipe
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "smoke"
          Copy-Item build\Release $smoke -Recurse
          gh release download -R pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" -D $env:RUNNER_TEMP
          $archive = Get-ChildItem "$env:RUNNER_TEMP\mesa3d-*-release-msvc.7z" | Select-Object -First 1
          7z x $archive.FullName "-o$env:RUNNER_TEMP\mesa" "x64\*.dll" -y | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mesa\x64\*.dll" $smoke
          $p = Start-Process "$smoke\Augmentinel.exe" -Wait -PassThru -ArgumentList `
            "--screenshot", "$smoke\smoke.png", "--frames", "300", "--press", "30:Space", "--press", "120:Return"
          if ($p.ExitCode -ne 0 -or !(Test-Path "$smoke\smoke.png")) { Write-Error "Smoke test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          build/Augmentinel.app/Contents/MacOS/Augmentinel --screenshot "$RUNNER_TEMP/smoke/smoke.png" \
            --frames 300 --press 30:Space --press 120:Return
          test -f "$RUNNER_TEMP/smoke/smoke.png"

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke/smoke.png
          if-no-files-found: ignore

      # The .rc embeds the icon and version block; fail if it is missing.
      - name: Check version resource (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Item build\Release\Augmentinel.exe).VersionInfo
          Write-Host "ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion) FileDescription=$($v.FileDescription)"
          if ($v.ProductName -ne 'Augmentinel') { Write-Error 'Version resource missing from Augmentinel.exe'; exit 1 }

      - name: Signing skipped (Windows)
        if: runner.os == 'Windows' && needs.setup.outputs.sign == 'true' && env.WIN_SIGN != 'true'
        shell: bash
        run: echo "::warning::Windows signing requested but ES_USERNAME is not set; Augmentinel.exe ships unsigned."

      # SSL.com eSigner cloud signing (see packaging/windows/SIGNING.md), after
      # the smoke test so a broken build never spends a signing. CodeSignTool
      # refuses output_path == the input's directory, so sign into build\signed
      # and copy the signed exe back over Release\ below.
      # malware_block=false skips eSigner's slow scan gate.
      - name: Prepare signing (Windows)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build\signed | Out-Null

      # SSL.com's CodeSignTool.bat always runs the Java 11.0.2 bundled in its zip,
      # which does not trust the "SSL.com TLS RSA Root CA 2022" chain cs.ssl.com
      # has used since 2026-09-22 ("PKIX path building failed"). So run the same
      # tool's jar on the runner's JDK 17 instead.
      - name: Sign Augmentinel.exe (Windows, eSigner)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CODESIGNTOOL_VERSION: v1.3.2
        run: |
          $tool = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          $zip = "$tool.zip"
          Invoke-WebRequest "https://github.com/SSLcom/CodeSignTool/releases/download/$env:CODESIGNTOOL_VERSION/CodeSignTool-$env:CODESIGNTOOL_VERSION-windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $tool -Force
          $jar = Get-ChildItem "$tool\jar\code_sign_tool-*.jar" | Select-Object -First 1
          if (!$jar) { Write-Error "CodeSignTool jar not found in $tool"; exit 1 }
          $javaHome = if ($env:JAVA_HOME_17_X64) { $env:JAVA_HOME_17_X64 } else { $env:JAVA_HOME }
          $java = Join-Path $javaHome "bin\java.exe"
          & $java -version
          $env:CODE_SIGN_TOOL_PATH = $tool
          Push-Location $tool
          & $java -jar $jar.FullName sign `
            "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" `
            "-credential_id=$env:ES_CREDENTIAL_ID" "-totp_secret=$env:ES_TOTP_SECRET" `
            "-input_file_path=$env:GITHUB_WORKSPACE\build\Release\Augmentinel.exe" `
            "-output_dir_path=$env:GITHUB_WORKSPACE\build\signed" `
            "-override=true" "-malware_block=false"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { Write-Error "CodeSignTool exited with $code"; exit 1 }

      - name: Verify signature (Windows)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        run: |
          $signed = "build\signed\Augmentinel.exe"
          if (!(Test-Path $signed)) { Write-Error "Signed exe not found at $signed"; exit 1 }
          Copy-Item $signed "build\Release\Augmentinel.exe" -Force
          $sig = Get-AuthenticodeSignature "build\Release\Augmentinel.exe"
          Write-Host "Signature status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Augmentinel.exe signature is not Valid: $($sig.Status)"; exit 1 }

      # The exe is statically linked (SDL2, SDL2_mixer and the CRT), so it only
      # needs the game data beside it.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist\Augmentinel-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($item in "Augmentinel.exe", "48.rom", "sentinel.sna", "shaders", "sounds") {
            Copy-Item "build\Release\$item" $out -Recurse
          }
          Copy-Item packaging\README.txt, COPYING $out
          Get-ChildItem $out -Recurse -File | ForEach-Object { Write-Host $_.FullName.Substring((Resolve-Path $out).Path.Length + 1) }

      # The .app is ad-hoc signed only (no identity). Developer ID signing and
      # notarisation run locally. It is zipped with ditto because upload-artifact
      # drops the executable bit inside a bundle.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          bin=build/Augmentinel.app/Contents/MacOS/Augmentinel
          lipo -archs "$bin"
          for a in arm64 x86_64; do
            lipo -archs "$bin" | tr ' ' '\n' | grep -qx "$a" \
              || { echo "ERROR: $bin is missing the '$a' slice"; exit 1; }
          done
          out=dist/Augmentinel-macos
          mkdir -p "$out"
          cp -R build/Augmentinel.app "$out/"
          cp packaging/README.txt COPYING "$out/"
          codesign --force --deep --sign - "$out/Augmentinel.app"
          codesign --verify --deep --strict "$out/Augmentinel.app"
          ditto -c -k --norsrc --noextattr --noacl "$out" dist/Augmentinel-macos.zip
          ls -l dist

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Augmentinel-windows-x64
          path: dist/Augmentinel-windows-x64/
          if-no-files-found: error

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: Augmentinel-macos
          path: dist/Augmentinel-macos.zip
          if-no-files-found: error

  # Publish the signed Windows build to itch.io on release tags, gated on the
  # BUTLER_API_KEY secret (butler reads it from the environment). The mac
  # channel is pushed from the Mac after local signing and notarisation
  # (packaging/itch/butler_push.sh). See docs/releasing.md.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      ITCH_TARGET: kranzky/augmentinel
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # The itch.io user version comes from the tag, which must match the
      # version the build was made with.
      - name: Tag matches CMake version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -nE 's/^project\(Augmentinel VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          echo "tag=$tag cmake=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $ver) in CMakeLists.txt"; exit 1; }
          echo "USERVERSION=$tag" >> "$GITHUB_ENV"

      - name: Skip without BUTLER_API_KEY
        if: env.BUTLER_API_KEY == ''
        shell: bash
        run: echo "::warning::BUTLER_API_KEY is not set; nothing was pushed to itch.io."

      - name: Download Windows build
        if: env.BUTLER_API_KEY != ''
        uses: actions/download-artifact@v7
        with:
          name: Augmentinel-windows-x64
          path: dist/windows

      # Never publish an unsigned exe (for example before the ES_* secrets exist).
      - name: Require a valid signature
        if: env.BUTLER_API_KEY != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\windows\Augmentinel.exe
          Write-Host "Signature status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Augmentinel.exe is not validly signed ($($sig.Status)); not publishing"; exit 1 }

      - name: Install butler
        if: env.BUTLER_API_KEY != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler
          .\butler\butler.exe -V

      - name: Push windows channel
        if: env.BUTLER_API_KEY != ''
        shell: bash
        run: |
          ./butler/butler.exe push dist/windows "$ITCH_TARGET:windows" --userversion "$USERVERSION"
          ./butler/butler.exe status "$ITCH_TARGET:windows"
